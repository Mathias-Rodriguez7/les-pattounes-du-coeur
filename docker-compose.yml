services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: les_pattounes_app
    restart: unless-stopped
    depends_on:
      - db
      - s3
    ports:
      - '5173:5173'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: postgres:16-alpine
    container_name: les_pattounes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  # Serveur S3 local (développement uniquement)
  s3-perms:
    image: alpine:3.20
    command: chown -R 10001:10001 /data
    volumes:
      - s3_data:/data

  # Serveur S3 local (développement uniquement)
  s3:
    image: rustfs/rustfs:1.0.3
    container_name: les_pattounes_s3
    restart: unless-stopped
    depends_on:
      s3-perms:
        condition: service_completed_successfully
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      # Autorise ton appli (dans le navigateur) à envoyer des fichiers directement
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # interface web
    volumes:
      - s3_data:/data

volumes:
  db_data:
  s3_data:
